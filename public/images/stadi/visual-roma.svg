<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Visual istituzionale ispirato a Roma">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12314a"/>
      <stop offset="1" stop-color="#0b1d2e"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E8B23A" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E8B23A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#4fa9e0" stroke-opacity="0.08" stroke-width="0.6"/>
    </pattern>
    <style>
      @keyframes nicPulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      .pulse { animation: nicPulse 3.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <rect width="320" height="200" fill="url(#grid)"/>
  <rect x="0" y="120" width="320" height="80" fill="url(#warm)"/>

  <!-- Arcata monumentale astratta (evocazione, non riproduzione) -->
  <g fill="none" stroke="#4fa9e0" stroke-opacity="0.55" stroke-width="1.2">
    <path d="M 60 158 Q 60 78 160 78 Q 260 78 260 158"/>
    <path d="M 78 158 Q 78 92 160 92 Q 242 92 242 158" stroke-opacity="0.4"/>
    <path d="M 96 158 Q 96 106 160 106 Q 224 106 224 158" stroke-opacity="0.3"/>
  </g>
  <!-- Colonne astratte -->
  <g stroke="#4fa9e0" stroke-opacity="0.35" stroke-width="0.9">
    <line x1="90"  y1="158" x2="90"  y2="132"/>
    <line x1="130" y1="158" x2="130" y2="120"/>
    <line x1="160" y1="158" x2="160" y2="112"/>
    <line x1="190" y1="158" x2="190" y2="120"/>
    <line x1="230" y1="158" x2="230" y2="132"/>
  </g>
  <!-- Terreno -->
  <line x1="20" y1="158" x2="300" y2="158" stroke="#4fa9e0" stroke-opacity="0.5" stroke-width="1.1"/>
  <!-- Sole/luce oro all'orizzonte -->
  <circle cx="160" cy="158" r="34" fill="#E8B23A" fill-opacity="0.14"/>
  <circle cx="160" cy="158" r="3.6" fill="#E8B23A" class="pulse"/>
  <!-- Bordo oro sottile -->
  <line x1="0" y1="0.5" x2="320" y2="0.5" stroke="#E8B23A" stroke-opacity="0.4" stroke-width="1"/>
</svg>
