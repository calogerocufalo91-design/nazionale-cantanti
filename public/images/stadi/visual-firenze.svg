<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Visual istituzionale ispirato a Firenze">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12314a"/>
      <stop offset="1" stop-color="#0b1d2e"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E8B23A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E8B23A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#4fa9e0" stroke-opacity="0.08" stroke-width="0.6"/>
    </pattern>
    <style>
      @keyframes nicPulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      .pulse { animation: nicPulse 3.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <rect width="320" height="200" fill="url(#grid)"/>
  <rect x="0" y="115" width="320" height="85" fill="url(#warm)"/>

  <!-- Colline dolci sullo sfondo -->
  <g fill="#4fa9e0" fill-opacity="0.12">
    <path d="M 0 140 Q 60 118 130 132 Q 200 148 280 122 Q 310 116 320 122 L 320 200 L 0 200 Z"/>
  </g>
  <g fill="none" stroke="#4fa9e0" stroke-opacity="0.35" stroke-width="0.9">
    <path d="M 0 140 Q 60 118 130 132 Q 200 148 280 122 Q 310 116 320 122"/>
  </g>
  <!-- Cupola astratta al centro (evocazione, non riproduzione) -->
  <g fill="none" stroke="#E8B23A" stroke-opacity="0.6" stroke-width="1.1">
    <path d="M 130 130 Q 130 74 160 68 Q 190 74 190 130"/>
    <line x1="160" y1="52" x2="160" y2="68"/>
    <line x1="130" y1="130" x2="190" y2="130"/>
    <path d="M 122 130 L 198 130 L 194 138 L 126 138 Z" fill="#E8B23A" fill-opacity="0.12" stroke-opacity="0.3"/>
  </g>
  <!-- Piccole finestre astratte -->
  <g fill="#4fa9e0" fill-opacity="0.35">
    <rect x="146" y="110" width="3" height="8"/>
    <rect x="158" y="106" width="3" height="10"/>
    <rect x="170" y="110" width="3" height="8"/>
  </g>
  <!-- Terreno + luce oro -->
  <line x1="20" y1="176" x2="300" y2="176" stroke="#4fa9e0" stroke-opacity="0.45" stroke-width="1"/>
  <circle cx="160" cy="54" r="3.6" fill="#E8B23A" class="pulse"/>
  <line x1="0" y1="0.5" x2="320" y2="0.5" stroke="#E8B23A" stroke-opacity="0.4" stroke-width="1"/>
</svg>
