<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Visual istituzionale temporaneo dello stadio">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12314a"/>
      <stop offset="1" stop-color="#0b1d2e"/>
    </linearGradient>
    <linearGradient id="pitchGlow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#4fa9e0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4fa9e0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8B23A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E8B23A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E8B23A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#4fa9e0" stroke-opacity="0.08" stroke-width="0.6"/>
    </pattern>
    <clipPath id="frame">
      <rect width="320" height="200" rx="0"/>
    </clipPath>
    <style>
      @keyframes nicBeam {
        0%   { transform: translateX(-45%); opacity: 0; }
        20%  { opacity: 1; }
        80%  { opacity: 1; }
        100% { transform: translateX(45%); opacity: 0; }
      }
      @keyframes nicPulse {
        0%,100% { opacity: 0.55; }
        50%     { opacity: 1; }
      }
      .beam { animation: nicBeam 6.5s ease-in-out infinite; transform-origin: center; }
      .pulse { animation: nicPulse 3s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .beam, .pulse { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- fondo notte -->
    <rect width="320" height="200" fill="url(#sky)"/>

    <!-- pattern blueprint sottile -->
    <rect width="320" height="200" fill="url(#grid)"/>

    <!-- alone del campo -->
    <ellipse cx="160" cy="215" rx="200" ry="70" fill="url(#pitchGlow)"/>

    <!-- tribune curve stilizzate (blueprint) -->
    <g fill="none" stroke="#4fa9e0" stroke-opacity="0.55" stroke-width="1.1">
      <path d="M 30 155 Q 160 90 290 155"/>
      <path d="M 20 165 Q 160 88 300 165" stroke-opacity="0.35"/>
      <path d="M 10 176 Q 160 86 310 176" stroke-opacity="0.22"/>
    </g>

    <!-- righe verticali tribuna (settori) -->
    <g stroke="#4fa9e0" stroke-opacity="0.22" stroke-width="0.7">
      <line x1="70"  y1="118" x2="70"  y2="160"/>
      <line x1="110" y1="106" x2="110" y2="160"/>
      <line x1="160" y1="100" x2="160" y2="160"/>
      <line x1="210" y1="106" x2="210" y2="160"/>
      <line x1="250" y1="118" x2="250" y2="160"/>
    </g>

    <!-- campo stilizzato -->
    <g fill="none" stroke="#4fa9e0" stroke-opacity="0.6" stroke-width="1.2">
      <ellipse cx="160" cy="172" rx="140" ry="26"/>
      <ellipse cx="160" cy="172" rx="80"  ry="14" stroke-opacity="0.42"/>
      <line x1="160" y1="146" x2="160" y2="198" stroke-opacity="0.42"/>
    </g>

    <!-- pali luce + lampade oro -->
    <g stroke="#4fa9e0" stroke-opacity="0.55" stroke-width="1.2">
      <line x1="42"  y1="150" x2="42"  y2="52"/>
      <line x1="278" y1="150" x2="278" y2="52"/>
    </g>
    <g fill="#E8B23A" class="pulse">
      <circle cx="42"  cy="50" r="3.6"/>
      <circle cx="278" cy="50" r="3.6"/>
    </g>
    <g fill="#E8B23A" opacity="0.35">
      <circle cx="42"  cy="50" r="8"/>
      <circle cx="278" cy="50" r="8"/>
    </g>

    <!-- fascio di luce che scorre (soft) -->
    <rect class="beam" x="-40" y="0" width="200" height="200" fill="url(#scanBeam)"/>

    <!-- linea sottile in alto (bordo blueprint) -->
    <line x1="0" y1="0.5" x2="320" y2="0.5" stroke="#E8B23A" stroke-opacity="0.4" stroke-width="1"/>
  </g>
</svg>
