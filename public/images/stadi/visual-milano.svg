<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Visual istituzionale ispirato a Milano">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12314a"/>
      <stop offset="1" stop-color="#0b1d2e"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#4fa9e0" stroke-opacity="0.08" stroke-width="0.6"/>
    </pattern>
    <style>
      @keyframes nicPulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      .pulse { animation: nicPulse 3.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <rect width="320" height="200" fill="url(#grid)"/>

  <!-- Skyline astratto: grattacieli verticali di altezze e larghezze diverse -->
  <g fill="#4fa9e0" fill-opacity="0.14">
    <rect x="30"  y="120" width="20" height="52"/>
    <rect x="58"  y="98"  width="14" height="74"/>
    <rect x="80"  y="108" width="18" height="64"/>
    <rect x="106" y="70"  width="12" height="102"/>
    <rect x="124" y="88"  width="22" height="84"/>
    <rect x="152" y="54"  width="10" height="118"/>
    <rect x="168" y="88"  width="18" height="84"/>
    <rect x="192" y="72"  width="14" height="100"/>
    <rect x="212" y="102" width="20" height="70"/>
    <rect x="238" y="86"  width="12" height="86"/>
    <rect x="256" y="112" width="18" height="60"/>
    <rect x="280" y="128" width="16" height="44"/>
  </g>
  <g fill="none" stroke="#4fa9e0" stroke-opacity="0.55" stroke-width="0.9">
    <rect x="30"  y="120" width="20" height="52"/>
    <rect x="58"  y="98"  width="14" height="74"/>
    <rect x="80"  y="108" width="18" height="64"/>
    <rect x="106" y="70"  width="12" height="102"/>
    <rect x="124" y="88"  width="22" height="84"/>
    <rect x="152" y="54"  width="10" height="118"/>
    <rect x="168" y="88"  width="18" height="84"/>
    <rect x="192" y="72"  width="14" height="100"/>
    <rect x="212" y="102" width="20" height="70"/>
    <rect x="238" y="86"  width="12" height="86"/>
    <rect x="256" y="112" width="18" height="60"/>
    <rect x="280" y="128" width="16" height="44"/>
  </g>
  <!-- Finestre luminose astratte (punti oro) -->
  <g fill="#E8B23A" fill-opacity="0.55" class="pulse">
    <circle cx="132" cy="118" r="1.4"/>
    <circle cx="132" cy="132" r="1.4"/>
    <circle cx="176" cy="112" r="1.4"/>
    <circle cx="220" cy="122" r="1.4"/>
    <circle cx="220" cy="140" r="1.4"/>
    <circle cx="112" cy="98"  r="1.4"/>
  </g>
  <!-- Terreno + guglia (evocazione verticale sottile) -->
  <line x1="20" y1="172" x2="300" y2="172" stroke="#4fa9e0" stroke-opacity="0.5" stroke-width="1.1"/>
  <line x1="157" y1="34" x2="157" y2="54" stroke="#E8B23A" stroke-opacity="0.5" stroke-width="0.9"/>
  <circle cx="157" cy="34" r="2.8" fill="#E8B23A" class="pulse"/>
  <line x1="0" y1="0.5" x2="320" y2="0.5" stroke="#E8B23A" stroke-opacity="0.4" stroke-width="1"/>
</svg>
