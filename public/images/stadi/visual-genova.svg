<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Visual istituzionale ispirato a Genova">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12314a"/>
      <stop offset="1" stop-color="#0b1d2e"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa9e0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4fa9e0" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#4fa9e0" stroke-opacity="0.08" stroke-width="0.6"/>
    </pattern>
    <style>
      @keyframes nicPulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      @keyframes nicSweep { 0%,100% { opacity: 0.15; } 50% { opacity: 0.5; } }
      .pulse { animation: nicPulse 3.4s ease-in-out infinite; }
      .sweep { animation: nicSweep 5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .pulse,.sweep { animation: none; } }
    </style>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <rect width="320" height="200" fill="url(#grid)"/>

  <!-- Mare in primo piano, orizzonte alto -->
  <rect x="0" y="120" width="320" height="80" fill="url(#sea)"/>
  <g stroke="#4fa9e0" stroke-opacity="0.35" stroke-width="0.9" fill="none">
    <path d="M 0 138 Q 40 132 80 138 T 160 138 T 240 138 T 320 138"/>
    <path d="M 0 154 Q 40 148 80 154 T 160 154 T 240 154 T 320 154" stroke-opacity="0.24"/>
    <path d="M 0 172 Q 40 166 80 172 T 160 172 T 240 172 T 320 172" stroke-opacity="0.18"/>
  </g>

  <!-- Faro astratto sulla destra (linea sottile con lanterna oro) -->
  <g stroke="#4fa9e0" stroke-opacity="0.55" stroke-width="1.1" fill="none">
    <line x1="260" y1="120" x2="260" y2="42"/>
    <line x1="254" y1="120" x2="254" y2="46" stroke-opacity="0.3"/>
    <line x1="266" y1="120" x2="266" y2="46" stroke-opacity="0.3"/>
  </g>
  <rect x="254" y="38" width="12" height="8" fill="#E8B23A" fill-opacity="0.35" stroke="#E8B23A" stroke-opacity="0.6" stroke-width="0.7"/>
  <circle cx="260" cy="42" r="3" fill="#E8B23A" class="pulse"/>
  <!-- Fascio luce faro (soft) -->
  <path d="M 260 42 L 40 100 L 40 108 L 260 46 Z" fill="#E8B23A" fill-opacity="0.14" class="sweep"/>

  <!-- Silhouette colline/città in lontananza -->
  <g fill="#4fa9e0" fill-opacity="0.14">
    <path d="M 0 118 L 40 108 L 80 116 L 130 100 L 180 112 L 220 106 L 240 120 L 240 130 L 0 130 Z"/>
  </g>

  <line x1="0" y1="0.5" x2="320" y2="0.5" stroke="#E8B23A" stroke-opacity="0.4" stroke-width="1"/>
</svg>
