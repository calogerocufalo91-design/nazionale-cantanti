<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Visual istituzionale ispirato a Pontremoli">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12314a"/>
      <stop offset="1" stop-color="#0b1d2e"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa9e0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4fa9e0" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#4fa9e0" stroke-opacity="0.08" stroke-width="0.6"/>
    </pattern>
    <style>
      @keyframes nicPulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      .pulse { animation: nicPulse 3.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <rect width="320" height="200" fill="url(#grid)"/>

  <!-- Colline dolci sullo sfondo -->
  <g fill="#4fa9e0" fill-opacity="0.14">
    <path d="M 0 130 Q 60 108 130 122 Q 200 138 280 112 Q 310 106 320 112 L 320 200 L 0 200 Z"/>
  </g>
  <g fill="none" stroke="#4fa9e0" stroke-opacity="0.4" stroke-width="0.9">
    <path d="M 0 130 Q 60 108 130 122 Q 200 138 280 112 Q 310 106 320 112"/>
  </g>

  <!-- Ponte astratto (3 archi piccoli) sopra il fiume -->
  <g fill="none" stroke="#E8B23A" stroke-opacity="0.6" stroke-width="1.1">
    <path d="M 100 158 Q 100 138 120 138 Q 140 138 140 158"/>
    <path d="M 140 158 Q 140 138 160 138 Q 180 138 180 158"/>
    <path d="M 180 158 Q 180 138 200 138 Q 220 138 220 158"/>
    <line x1="100" y1="138" x2="220" y2="138" stroke-opacity="0.35"/>
  </g>
  <!-- Fiume in basso -->
  <path d="M 0 160 Q 80 152 160 160 Q 240 168 320 156 L 320 200 L 0 200 Z" fill="url(#river)"/>
  <g stroke="#4fa9e0" stroke-opacity="0.35" stroke-width="0.8" fill="none">
    <path d="M 0 170 Q 40 166 80 170 T 160 170 T 240 170 T 320 170"/>
    <path d="M 0 184 Q 40 180 80 184 T 160 184 T 240 184 T 320 184" stroke-opacity="0.22"/>
  </g>
  <!-- Piccola torre astratta -->
  <line x1="160" y1="140" x2="160" y2="88" stroke="#E8B23A" stroke-opacity="0.55" stroke-width="1"/>
  <circle cx="160" cy="88" r="2.8" fill="#E8B23A" class="pulse"/>
  <line x1="0" y1="0.5" x2="320" y2="0.5" stroke="#E8B23A" stroke-opacity="0.4" stroke-width="1"/>
</svg>
