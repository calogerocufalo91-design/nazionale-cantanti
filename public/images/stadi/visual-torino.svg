<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Visual istituzionale ispirato a Torino">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12314a"/>
      <stop offset="1" stop-color="#0b1d2e"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#4fa9e0" stroke-opacity="0.08" stroke-width="0.6"/>
    </pattern>
    <style>
      @keyframes nicPulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      .pulse { animation: nicPulse 3.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <rect width="320" height="200" fill="url(#grid)"/>

  <!-- Silhouette montagne alpine (astratte, non riproduzione) -->
  <g fill="#4fa9e0" fill-opacity="0.14">
    <path d="M 0 130 L 45 88 L 80 108 L 120 72 L 155 100 L 195 78 L 235 106 L 275 88 L 320 118 L 320 200 L 0 200 Z"/>
  </g>
  <g fill="none" stroke="#4fa9e0" stroke-opacity="0.45" stroke-width="1">
    <path d="M 0 130 L 45 88 L 80 108 L 120 72 L 155 100 L 195 78 L 235 106 L 275 88 L 320 118"/>
  </g>
  <!-- Guglia centrale verticale (elemento architettonico astratto) -->
  <g stroke="#E8B23A" stroke-opacity="0.7" stroke-width="1.1" fill="none">
    <line x1="160" y1="42" x2="160" y2="158"/>
    <path d="M 156 60 L 160 42 L 164 60 Z" fill="#E8B23A" fill-opacity="0.25"/>
  </g>
  <!-- Cornice architettonica: linee ordinate a griglia stretta -->
  <g stroke="#4fa9e0" stroke-opacity="0.28" stroke-width="0.7">
    <line x1="110" y1="130" x2="110" y2="158"/>
    <line x1="130" y1="122" x2="130" y2="158"/>
    <line x1="190" y1="122" x2="190" y2="158"/>
    <line x1="210" y1="130" x2="210" y2="158"/>
    <line x1="90"  y1="145" x2="230" y2="145" stroke-opacity="0.22"/>
  </g>
  <!-- Terreno + luce oro -->
  <line x1="20" y1="158" x2="300" y2="158" stroke="#4fa9e0" stroke-opacity="0.5" stroke-width="1.1"/>
  <circle cx="160" cy="44" r="4" fill="#E8B23A" class="pulse"/>
  <line x1="0" y1="0.5" x2="320" y2="0.5" stroke="#E8B23A" stroke-opacity="0.4" stroke-width="1"/>
</svg>
