<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Visual istituzionale ispirato a Napoli">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12314a"/>
      <stop offset="1" stop-color="#0b1d2e"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa9e0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#4fa9e0" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#4fa9e0" stroke-opacity="0.08" stroke-width="0.6"/>
    </pattern>
    <style>
      @keyframes nicPulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      .pulse { animation: nicPulse 3.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <rect width="320" height="200" fill="url(#grid)"/>

  <!-- Silhouette montagnosa asimmetrica (evocazione, non riproduzione) -->
  <g fill="#4fa9e0" fill-opacity="0.16">
    <path d="M 0 150 L 60 140 L 130 100 L 175 78 L 220 118 L 270 132 L 320 140 L 320 200 L 0 200 Z"/>
  </g>
  <g fill="none" stroke="#4fa9e0" stroke-opacity="0.45" stroke-width="1">
    <path d="M 0 150 L 60 140 L 130 100 L 175 78 L 220 118 L 270 132 L 320 140"/>
  </g>
  <!-- Piccolo pennacchio astratto -->
  <g stroke="#4fa9e0" stroke-opacity="0.32" stroke-width="0.9" fill="none">
    <path d="M 168 78 Q 160 66 165 54 Q 172 46 168 34"/>
  </g>
  <!-- Golfo (curva morbida in primo piano) -->
  <path d="M 0 172 Q 80 156 160 168 Q 240 180 320 162 L 320 200 L 0 200 Z" fill="url(#sea)"/>
  <g stroke="#4fa9e0" stroke-opacity="0.4" stroke-width="0.9" fill="none">
    <path d="M 0 172 Q 80 156 160 168 Q 240 180 320 162"/>
    <path d="M 0 184 Q 80 176 160 184 Q 240 190 320 178" stroke-opacity="0.22"/>
  </g>
  <!-- Luce oro sull'acqua -->
  <circle cx="215" cy="170" r="3.6" fill="#E8B23A" class="pulse"/>
  <circle cx="215" cy="170" r="10" fill="#E8B23A" fill-opacity="0.15"/>
  <line x1="0" y1="0.5" x2="320" y2="0.5" stroke="#E8B23A" stroke-opacity="0.4" stroke-width="1"/>
</svg>
