<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Visual istituzionale ispirato a Verona">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12314a"/>
      <stop offset="1" stop-color="#0b1d2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.85" r="0.7">
      <stop offset="0" stop-color="#E8B23A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E8B23A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#4fa9e0" stroke-opacity="0.08" stroke-width="0.6"/>
    </pattern>
    <style>
      @keyframes nicPulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      .pulse { animation: nicPulse 3.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <rect width="320" height="200" fill="url(#grid)"/>
  <rect width="320" height="200" fill="url(#glow)"/>

  <!-- Arena ellittica astratta (cerchi concentrici) -->
  <g fill="none" stroke="#E8B23A" stroke-opacity="0.55" stroke-width="1.1">
    <ellipse cx="160" cy="130" rx="115" ry="42"/>
    <ellipse cx="160" cy="130" rx="95"  ry="34" stroke-opacity="0.4"/>
    <ellipse cx="160" cy="130" rx="75"  ry="26" stroke-opacity="0.28"/>
    <ellipse cx="160" cy="130" rx="55"  ry="18" stroke-opacity="0.2"/>
  </g>
  <!-- Archi verticali stilizzati (arcate esterne) -->
  <g stroke="#4fa9e0" stroke-opacity="0.35" stroke-width="0.8">
    <path d="M 60 130 Q 60 108 80 108 Q 100 108 100 130" fill="none"/>
    <path d="M 220 130 Q 220 108 240 108 Q 260 108 260 130" fill="none"/>
    <path d="M 140 130 Q 140 100 160 100 Q 180 100 180 130" fill="none"/>
  </g>
  <!-- Terreno -->
  <line x1="20" y1="176" x2="300" y2="176" stroke="#4fa9e0" stroke-opacity="0.45" stroke-width="1"/>
  <!-- Luce oro centrale -->
  <circle cx="160" cy="130" r="3.6" fill="#E8B23A" class="pulse"/>
  <line x1="0" y1="0.5" x2="320" y2="0.5" stroke="#E8B23A" stroke-opacity="0.4" stroke-width="1"/>
</svg>
